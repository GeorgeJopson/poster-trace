# Netlify detects Next.js and applies its adapter (@netlify/plugin-nextjs)
# automatically, so the plugin is deliberately not pinned here.
# See https://docs.netlify.com/frameworks/next-js/overview/

[build]
  # Runs `prisma migrate deploy && next build` (see package.json).
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Prisma 7 and Next.js 16 both need a recent Node LTS.
  NODE_VERSION = "24"

# Deploy previews and branch deploys use the same build command, so they
# migrate their own database too. Their DATABASE_URL must point at a separate
# database in the Netlify UI, never production's, because these builds run
# migrations from unmerged branches.
