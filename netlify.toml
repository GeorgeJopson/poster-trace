# Netlify detects Next.js and applies its adapter (@netlify/plugin-nextjs)
# automatically, so the plugin is deliberately not pinned here.
# See https://docs.netlify.com/frameworks/next-js/overview/

[build]
  # Runs `prisma migrate deploy && next build` (see package.json).
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Prisma 7 and Next.js 16 both need a recent Node LTS.
  NODE_VERSION = "24"

# Deploy previews and branch deploys must not run migrations against the
# production database. Point DATABASE_URL at a separate database for these
# contexts in the Netlify UI, or skip migrations entirely as below.
[context.deploy-preview]
  command = "npx next build"

[context.branch-deploy]
  command = "npx next build"
