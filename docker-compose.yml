services:
  postgres:
    image: postgres:18
    container_name: poster-trace-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: poster_trace
      POSTGRES_PASSWORD: poster_trace
      POSTGRES_DB: poster_trace
    ports:
      - "5432:5432"
    volumes:
      - poster-trace-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poster_trace -d poster_trace"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  poster-trace-pgdata:
